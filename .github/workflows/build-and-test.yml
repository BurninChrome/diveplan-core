name: build-and-test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  c:
    name: C library and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool

      - name: Bootstrap
        run: ./bootstrap.sh

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      # The C unit tests have never run in CI before this workflow existed:
      # .travis.yml only ever invoked the Python test. See
      # .okf/findings/ci-never-runs-c-tests.md
      - name: Run unit tests
        run: make check

      - name: Show test log on failure
        if: failure()
        run: |
          for f in test/test-suite.log test/test_buhlmann.log; do
            [ -f "$f" ] && { echo "===== $f"; cat "$f"; }
          done
          exit 0

      - name: Smoke-test the dive binary end to end
        run: |
          python3 test/gen_dive.py -d 20 -t 5 | src/dive > /tmp/out.txt
          lines=$(wc -l < /tmp/out.txt)
          fields=$(head -1 /tmp/out.txt | wc -w)
          echo "produced $lines lines, $fields fields per line"
          test "$lines" -gt 0      || { echo "no output produced"; exit 1; }
          test "$fields" -eq 36    || { echo "expected 36 fields, got $fields"; exit 1; }
          grep -qi 'nan\|inf' /tmp/out.txt && { echo "NaN or Inf in output"; exit 1; }
          echo "ok"

  python:
    name: Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python unit tests
        working-directory: test
        run: python3 -m unittest discover -v

      - name: Check the profile generators run
        run: |
          python3 test/gen_dive.py -d 30 -t 20 > /dev/null
          for f in test/xml/*.xml; do
            python3 test/parse_dive.py -f "$f" > /dev/null || { echo "failed: $f"; exit 1; }
          done
          echo "gen_dive and parse_dive ok across $(ls test/xml/*.xml | wc -l) logs"

  okf:
    name: OKF bundle conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install --quiet 'pyyaml>=6'

      # Keeps .okf/ structurally valid: every concept needs parseable YAML
      # frontmatter with a non-empty `type` field (OKF v0.1 §9).
      - name: Validate frontmatter and structure
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          root = pathlib.Path('.okf')
          if not root.is_dir():
              print('no .okf/ bundle, skipping'); sys.exit(0)
          errors = []
          for f in sorted(root.rglob('*.md')):
              if f.name in ('index.md', 'log.md'):
                  continue
              text = f.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  errors.append(f'{f}: no frontmatter'); continue
              try:
                  fm = yaml.safe_load(text.split('---')[1])
              except Exception as e:
                  errors.append(f'{f}: unparseable YAML: {e}'); continue
              if not (fm or {}).get('type'):
                  errors.append(f'{f}: missing or empty `type`')
          for e in errors:
              print('ERROR', e)
          print(f'{len(list(root.rglob("*.md")))} markdown files checked')
          sys.exit(1 if errors else 0)
          PY

      # Documentation is English-only; pre-existing French content in
      # src/stop.c and doc/*.pdf is out of scope and deliberately untouched.
      - name: Check the bundle contains no Polish characters
        run: |
          if grep -rlP '[\x{0105}\x{0107}\x{0119}\x{0142}\x{0144}\x{00F3}\x{015B}\x{017A}\x{017C}\x{0104}\x{0106}\x{0118}\x{0141}\x{0143}\x{015A}\x{0179}\x{017B}]' .okf/ ; then
            echo "Polish characters found in .okf/ — documentation must be English"
            exit 1
          fi
          echo "ok"
