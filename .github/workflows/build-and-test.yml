name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c:
    name: C library and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool

      - name: Bootstrap
        run: ./bootstrap.sh

      - name: Configure
        run: ./configure

      # -Werror in CI only, not in configure.ac: a warning must never stop a
      # user from building the library, but it must stop it from landing here.
      - name: Build with warnings as errors
        run: make CFLAGS="-O2 -Werror"

      # The C unit tests have never run in CI before this workflow existed:
      # .travis.yml only ever invoked the Python test. See
      # .okf/findings/ci-never-runs-c-tests.md
      # CFLAGS repeated here: `make` alone does not build check_PROGRAMS, so
      # without this the -Werror gate would miss every line of the test suites.
      - name: Run unit tests
        run: make check CFLAGS="-O2 -Werror"

      - name: Show test log on failure
        if: failure()
        run: |
          for f in test/test-suite.log test/test_buhlmann.log test/test_vectors.log test/test_profiles.log; do
            [ -f "$f" ] && { echo "===== $f"; cat "$f"; }
          done
          exit 0

      - name: Smoke-test the dive binary end to end
        run: |
          python3 test/gen_dive.py -d 20 -t 5 | src/dive > /tmp/out.txt
          lines=$(wc -l < /tmp/out.txt)
          fields=$(head -1 /tmp/out.txt | wc -w)
          echo "produced $lines lines, $fields fields per line"
          test "$lines" -gt 0      || { echo "no output produced"; exit 1; }
          test "$fields" -eq 36    || { echo "expected 36 fields, got $fields"; exit 1; }
          grep -qi 'nan\|inf' /tmp/out.txt && { echo "NaN or Inf in output"; exit 1; }
          echo "ok"

  analysis:
    name: Static and dynamic analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install analysers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool cppcheck

      - name: Bootstrap and configure
        run: ./bootstrap.sh && ./configure

      # Library and tests analysed together. Apart from being more coverage,
      # it removes cppcheck's `unusedFunction` false positives: several public
      # API functions have no caller inside this repo — that is what a library
      # looks like — but the test suites do call them.
      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability,unusedFunction \
                   --std=c99 --inline-suppr -I src -I . \
                   --suppress=missingIncludeSystem --suppress=checkersReport \
                   --error-exitcode=1 \
                   src/*.c test/test_*.c

      # Catches null derefs, leaks, use-after-free. Little to find in a library
      # that never allocates, but it costs nothing and guards what comes next.
      - name: gcc -fanalyzer
        run: |
          fail=0
          for f in src/*.c test/test_*.c; do
            gcc -std=c99 -D_GNU_SOURCE -fanalyzer -Wall -Wextra -Werror \
                -I src -I . -c "$f" -o /dev/null || fail=1
          done
          exit $fail

      # The highest-value check for numerical code. UBSan with
      # float-divide-by-zero pinpoints the division-by-zero paths documented in
      # .okf/findings/ at their exact source lines; ASan covers the test
      # harnesses' own buffer handling. -fno-sanitize-recover makes any report
      # fatal rather than a log line nobody reads.
      - name: UBSan and ASan over the test suites
        run: |
          SAN="-fsanitize=undefined,address,float-divide-by-zero,float-cast-overflow"
          SAN="$SAN -fno-sanitize-recover=all -g -O1"
          LIB=$(ls src/*.c | grep -v dive.c)
          for t in test_buhlmann test_vectors test_profiles; do
            gcc -std=c99 -D_GNU_SOURCE $SAN -I src -I . -o "/tmp/$t" "test/$t.c" $LIB -lm
            ( cd test && "/tmp/$t" ) || exit 1
          done
          gcc -std=c99 -D_GNU_SOURCE $SAN -I src -I . -o /tmp/san_dive src/*.c -lm
          python3 test/gen_dive.py -d 30 -t 20 | /tmp/san_dive > /dev/null

      # ADVISORY, not a gate. Seven warnings exist today, all already recorded
      # in .okf/findings/ — missing prototypes on the OTU functions, `1.0f`
      # literals in double expressions, and three exact float comparisons. They
      # live in files covered by the algorithm integrity policy, so clearing
      # them needs approval and belongs to the BARR-C / Power of Ten pass.
      # Turn this into a gate once that pass lands.
      - name: Strict warning set (advisory)
        continue-on-error: true
        run: |
          STRICT="-Wconversion -Wsign-conversion -Wshadow -Wcast-qual"
          STRICT="$STRICT -Wstrict-prototypes -Wmissing-prototypes -Wdouble-promotion"
          STRICT="$STRICT -Wfloat-equal -Wpedantic -Wundef -Wwrite-strings"
          STRICT="$STRICT -Wredundant-decls -Wswitch-default -Wbad-function-cast"
          for f in src/*.c; do
            gcc -std=c99 -D_GNU_SOURCE -Wall -Wextra $STRICT -I src -I . \
                -c "$f" -o /dev/null
          done 2>&1 | tee /tmp/strict.log
          echo
          echo "warnings by category:"
          grep -oE '\[-W[a-z-]+\]' /tmp/strict.log | sort | uniq -c | sort -rn

  python:
    name: Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python unit tests
        working-directory: test
        run: python3 -m unittest discover -v

      # test/profiles/*.txt are converted from test/xml/. Nothing else ties
      # them together, so verify the conversion is still reproducible.
      - name: Converted profiles match their XML sources
        run: |
          fail=0
          for x in test/xml/*.xml; do
            b=$(basename "$x" .xml)
            python3 test/parse_dive.py -f "$x" > /tmp/p.txt
            if ! diff -q <(grep -v '^#' "test/profiles/$b.txt") /tmp/p.txt > /dev/null; then
              echo "stale: test/profiles/$b.txt"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "all 39 converted profiles match their XML"
          exit $fail

      - name: Check the profile generators run
        run: |
          python3 test/gen_dive.py -d 30 -t 20 > /dev/null
          for f in test/xml/*.xml; do
            python3 test/parse_dive.py -f "$f" > /dev/null || { echo "failed: $f"; exit 1; }
          done
          echo "gen_dive and parse_dive ok across $(ls test/xml/*.xml | wc -l) logs"

  okf:
    name: OKF bundle conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install --quiet 'pyyaml>=6'

      # Closes the "right count, wrong content" hole: a substituted or edited
      # vector row keeps every count intact and would otherwise pass unseen.
      - name: Vectors match their generator
        run: |
          python3 test/vectors/gen_vectors.py
          # `git add -N` first: without it a vector file deleted in the commit
          # comes back UNTRACKED after regeneration, and `git diff` ignores
          # untracked paths, so the step would pass on a deleted vector.
          git add -N test/vectors/
          # Scoped to *.tsv: those are what the generator produces. The
          # generator itself, expected-failures.txt and README.md are
          # hand-maintained and may legitimately change in the same commit.
          git diff --exit-code -- 'test/vectors/*.tsv' || {
            echo "test/vectors/*.tsv does not match gen_vectors.py output —"
            echo "either a vector was hand-edited or the generator changed"
            echo "without the vectors being regenerated."
            exit 1
          }

      # Full OKF v0.1 §9 conformance, not just a frontmatter smoke test.
      # Implemented inline rather than fetched at run time so CI has no network
      # dependency on third-party tooling.
      - name: Validate the bundle against OKF v0.1
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, yaml

          root = pathlib.Path('.okf')
          errors, concepts, indexes, logs = [], 0, 0, 0

          for f in sorted(root.rglob('*.md')):
              rel = f.relative_to(root)
              text = f.read_text(encoding='utf-8')

              # §6 — index.md carries no frontmatter, except the bundle-root
              # index which may declare okf_version and nothing else.
              if f.name == 'index.md':
                  indexes += 1
                  if text.startswith('---'):
                      if f.parent != root:
                          errors.append(f'{rel}: §6 non-root index.md must not have frontmatter')
                      else:
                          fm = yaml.safe_load(text.split('---')[1]) or {}
                          extra = set(fm) - {'okf_version'}
                          if extra:
                              errors.append(f'{rel}: §11 root index may only carry okf_version, found {sorted(extra)}')
                  continue

              # §7 — log.md date headings must be ISO YYYY-MM-DD.
              if f.name == 'log.md':
                  logs += 1
                  for h in re.findall(r'^##\s+(.+)$', text, re.M):
                      if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', h.strip()):
                          errors.append(f'{rel}: §7 date heading not ISO 8601: {h.strip()!r}')
                  continue

              # §9.1 / §9.2 — parseable frontmatter with a non-empty `type`.
              concepts += 1
              if not text.startswith('---'):
                  errors.append(f'{rel}: §9.1 missing frontmatter'); continue
              try:
                  fm = yaml.safe_load(text.split('---')[1])
              except Exception as e:
                  errors.append(f'{rel}: §9.1 unparseable YAML: {e}'); continue
              if not (fm or {}).get('type'):
                  errors.append(f'{rel}: §9.2 missing or empty `type`')

          for e in errors:
              print('ERROR', e)
          print(f'concepts: {concepts}   index.md: {indexes}   log.md: {logs}')
          print('non-conformant' if errors else 'conformant')
          sys.exit(1 if errors else 0)
          PY

      # Cross-links are bundle-relative (OKF §5.1), so they resolve against
      # .okf/ rather than the repo root. Verify they actually point somewhere.
      - name: Check cross-links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.okf')
          broken = []
          for f in root.rglob('*.md'):
              for _, target in re.findall(r'\[([^\]]*)\]\(([^)]+)\)', f.read_text(encoding='utf-8')):
                  if target.startswith(('http://', 'https://', '#')):
                      continue
                  t = target.split('#')[0]
                  p = (root / t.lstrip('/')) if t.startswith('/') else (f.parent / t)
                  if not p.exists():
                      broken.append(f'{f.relative_to(root)} -> {target}')
          for b in broken:
              print('BROKEN LINK', b)
          print(f'{len(broken)} broken links')
          sys.exit(1 if broken else 0)
          PY
